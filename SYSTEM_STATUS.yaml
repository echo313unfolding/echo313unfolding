_meta:
  purpose: >
    Single source of truth for the Echo Labs substrate. Every count in the profile or any
    README must be generated from or checked against this file. See docs/STATUS_SCHEMA.md.
  sources:
    - {id: public_checkout, type: observed}       # observed on the work-box: SHAs, default branches, the 3 READMEs
    - {id: advisor_home_context, type: reported}  # reported by advisor with home-box memory; NOT observed here
    - {id: home_box_verified, type: pending}      # pending local verification on the home box
  authored_from: >
    Component SHAs, default branches, and the three corrected READMEs are `public_checkout`
    (observed on the work-box). Items naming local-only trees, unpushed state, or advisor
    test counts are `advisor_home_context` (reported), NOT observed on GitHub — see
    verify_pending_on_home_box.
  observed_at: "2026-07-12T00:00:00Z"
  framing: >
    A local-first agent compute substrate that turns heterogeneous data and models into
    bounded artifacts, profiles them before expensive computation, routes them through
    constrained runtimes, gates execution, and records consequential transformations as
    verifiable evidence. NOT (yet) an OS, a data market, a rights protocol, or a universal
    ontology.
  recurring_primitive: profile -> route -> bounded execute -> receipt -> graph
  verification_summary:
    verified_on_work_box:
      - echo313unfolding/echo-sentry   # pytest -q = 60 passed @ 7a6c3790
    reported_or_not_run:
      - all_other_components
  IMPORTANT: >
    Only echo-sentry was EXECUTED on the work-box (60 passed). Every OTHER
    `verification.status` is `reported` or `not_run`; home-box review must run each command
    against `observed.commit_sha` to promote any count to `verified`.

